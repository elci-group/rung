name: CI
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - name: Install the production gate
        run: |
          cargo install --git https://github.com/elci-group/deliver --rev 93a90de52b18e9e0a1dd7e89988d2d055c91cae6 --locked --bin deliver
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
      - name: Run the production gate
        run: deliver --spec deliver.toml --strict
