[package]
name = "rung-dist"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Version anchor for theosis. The rung binary is the rung package in crates/rung-cli."
repository.workspace = true
publish = false

[workspace]
members = ["crates/rung-model", "crates/rung-core", "crates/rung-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
description = "Capability-preservation gate. Protected losses require a signed authorization against an accepted Git baseline."
repository = "https://github.com/elci-group/rung"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
git2 = "0.21"
syn = { version = "2.0", features = ["full", "visit"] }
ed25519-dalek = "2.2"
tracing = "0.1"
